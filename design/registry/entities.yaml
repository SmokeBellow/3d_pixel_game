# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-08-10"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: mouse_look_rotation
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md
      - design/gdd/camera-system.md
    variables:
      - raw_delta
      - sensitivity
      - base_scale
    output_range: ["unbounded", "clamped +-89 deg pitch"]
    expression: "raw_delta * sensitivity * base_scale"
    notes: "Not scaled by Time.deltaTime — mouse delta is a per-frame absolute
      value, not a rate. Consumed by camera-system.md's pitch_accumulation/
      yaw_accumulation as pitch_delta/yaw_delta (the actual clamp/wrap is
      owned by Camera System, not Input System, which is stateless)."
    added: 2026-08-10
    revised: ""

  - name: gamepad_stick_response
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md
    variables:
      - magnitude
      - deadzone
      - curve_exponent
      - direction
    output_range: [0.0, 1.0]
    expression: "0 if magnitude <= deadzone else ((magnitude - deadzone) / (1 - deadzone))^curve_exponent * direction"
    added: 2026-08-10
    revised: ""

  - name: gamepad_look_rotation
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md
      - design/gdd/camera-system.md
    variables:
      - gamepad_stick_response
      - look_speed_deg_per_sec
      - delta_time
    output_range: [0, "look_speed_deg_per_sec * delta_time"]
    expression: "gamepad_stick_response * look_speed_deg_per_sec * delta_time"
    notes: "Scaled by Time.deltaTime (unscaled) unlike mouse_look_rotation —
      gamepad stick represents a held rate, mouse delta does not. Consumed by
      camera-system.md's pitch_accumulation/yaw_accumulation as pitch_delta/
      yaw_delta."
    added: 2026-08-10
    revised: ""

  - name: pitch_accumulation
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    variables:
      - pitch_accumulated_prev
      - pitch_delta
    output_range: [-89, 89]
    expression: "clamp(pitch_accumulated_prev + pitch_delta, -89, 89)"
    notes: "Consumes mouse_look_rotation/gamepad_look_rotation from
      input-system.md as pitch_delta. Camera System owns this state; Input
      System is stateless and does not accumulate or clamp."
    added: 2026-08-26
    revised: ""

  - name: yaw_accumulation
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    variables:
      - yaw_accumulated_prev
      - yaw_delta
    output_range: [0, 360]
    expression: "((yaw_accumulated_prev + yaw_delta) mod 360 + 360) mod 360"
    notes: "Consumes mouse_look_rotation/gamepad_look_rotation from
      input-system.md as yaw_delta. Applied to the character body transform,
      not the camera pivot (see input-system.md's Core Rules for the
      body/camera split)."
    added: 2026-08-26
    revised: ""

  - name: fov_kick_response
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    variables:
      - t_since_trigger
      - kick_peak_offset_deg
      - kick_attack_time
      - kick_decay_time
    output_range: [0, "kick_peak_offset_deg"]
    expression: "kick_peak_offset_deg * kick_envelope(t_since_trigger)"
    notes: "Two-phase linear attack/decay envelope, triggered on CastSpell.
      Re-triggering resets t_since_trigger to 0 (no additive stacking)."
    added: 2026-08-26
    revised: ""

  - name: current_fov
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md
    variables:
      - base_fov
      - current_fov_offset
      - sprint_fov_offset
    output_range: ["base_fov", "base_fov + kick_peak_offset_deg (sprint TBD)"]
    expression: "base_fov + current_fov_offset + sprint_fov_offset"
    notes: "sprint_fov_offset is hardcoded 0 until a Sprint mechanic is
      designed in Player Controller GDD — flagged as an Open Question in
      camera-system.md."
    added: 2026-08-26
    revised: ""

  - name: synergy_damage_multiplier
    status: active
    source: design/gdd/health-damage-system.md
    referenced_by:
      - design/gdd/health-damage-system.md
    variables:
      - base_damage
      - synergy_multiplier
    output_range: [0, "unbounded"]
    expression: "final_damage_amount = base_damage * synergy_multiplier"
    notes: "synergy_multiplier defaults to 1.0 for normal hits. The 3.0
      reference value (Chain Shock) is a passthrough example only, NOT an
      authoritative design value — Elemental Synergy System (not yet
      designed) owns which combos exist and what multiplier each produces.
      Do not treat 3.0 as locked until that GDD confirms it."
    added: 2026-08-26
    revised: ""

  - name: hp_clamp
    status: active
    source: design/gdd/health-damage-system.md
    referenced_by:
      - design/gdd/health-damage-system.md
    variables:
      - currentHP_prev
      - delta_amount
      - maxHP
    output_range: [0, "maxHP"]
    expression: "currentHP_new = clamp(currentHP_prev + delta_amount, 0, maxHP)"
    notes: "delta_amount = -final_damage_amount for damage, +heal_amount for
      heal. No overheal banking — excess heal is discarded, not stored."
    added: 2026-08-26
    revised: ""

